[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anamnema"
version = "0.0.0.dev0"
description = "Source-linked memory for AI collaborators"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.10,<3", "pymongo>=4.10,<5"]

[project.scripts]
anamnema = "anamnema.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/anamnema"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "pyproject.toml", "uv.lock", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
